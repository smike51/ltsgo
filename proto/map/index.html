<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LTSGO · карта путешествия (прототип)</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.1.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="style.css?v=6">
</head>
<body>
<div id="map" aria-label="Карта путешествия"></div>

<aside class="story" id="story">
  <div class="top">
    <span class="eyebrow">LTSGO · прототип</span>
    <div class="books" id="books" role="tablist" aria-label="Книга"></div>
    <h1 id="b-title">—</h1>
    <div class="by" id="b-by">—</div>
  </div>

  <article class="stop" aria-live="polite">
    <span class="eyebrow" id="s-n">Остановка</span>
    <h2 id="s-name">—</h2>
    <div class="dates mono"><span id="s-jul">—</span><span id="s-greg"></span></div>
    <div class="meta">
      <span class="chip" id="s-status">—</span>
      <span id="s-tr">—</span>
    </div>
    <div class="letter" id="s-letter"></div>
    <div id="s-quotes"></div>
    <div class="people" id="s-people"></div>
    <div class="media" id="s-media"></div>
    <p class="note" id="s-note" hidden></p>
  </article>

  <div class="layers">
    <span class="eyebrow">Слои</span>
    <label><input type="checkbox" id="l-borders" checked> Границы эпохи</label>
    <label><input type="checkbox" id="l-relief" checked> Рельеф</label>
    <label><input type="checkbox" id="l-globe" checked> Глобус</label>
    <label><input type="checkbox" id="l-follow" checked> Камера за путешественником</label>
  </div>
  <p class="src">Границы: historical-basemaps (A. Ourednik, GPL-3.0), <span id="b-borders"></span>. Рельеф: Terrarium (AWS Open Data). Суша, реки: Natural Earth (PD). Маршрут, цитаты, люди: kb/staging — предложения, не утверждены.</p>
</aside>

<div class="scrub">
  <button id="play" type="button" aria-pressed="false">▶ Ехать</button>
  <button id="prev" type="button" aria-label="Предыдущая остановка">←</button>
  <button id="next" type="button" aria-label="Следующая остановка">→</button>
  <input id="pos" type="range" min="0" max="100" value="0" aria-label="Положение на маршруте">
  <span class="mono" id="pos-lbl">—</span>
</div>

<div class="legend">
  <div><svg width="36" height="8"><line x1="0" y1="4" x2="36" y2="4" class="lg-route" stroke-width="3"/></svg>экипаж</div>
  <div><svg width="36" height="8"><line x1="0" y1="4" x2="36" y2="4" class="lg-route" stroke-width="3" stroke-dasharray="1 4" stroke-linecap="round"/></svg>пешком</div>
  <div><svg width="36" height="8"><line x1="0" y1="4" x2="36" y2="4" class="lg-route" stroke-width="3" stroke-dasharray="8 3 1 3"/></svg>верхом</div>
  <div><svg width="36" height="8"><line x1="0" y1="4" x2="36" y2="4" class="lg-sledge" stroke-width="3" stroke-dasharray="4 2"/></svg>сани</div>
  <div><svg width="36" height="8"><line x1="0" y1="4" x2="36" y2="4" class="lg-water" stroke-width="3" stroke-dasharray="10 5"/></svg>по воде</div>
</div>

<script src="https://unpkg.com/maplibre-gl@5.1.0/dist/maplibre-gl.js"></script>
<script src="app.js?v=6"></script>
</body>
</html>
