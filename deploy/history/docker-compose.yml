# history.ltsgo.ru — static map prototype. Lives on starpom-app in /opt/ltsgo/history.
# No public port: the shared Caddy (aurav-caddy-1) proxies to ltsgo-history:80 over ai_network.
services:
  ltsgo-history:
    image: caddy:2-alpine
    container_name: ltsgo-history
    restart: unless-stopped
    command: caddy file-server --root /srv --listen :80
    volumes:
      - ./site:/srv:ro
    networks: [ai_network]
    mem_limit: 64m
networks:
  ai_network:
    external: true
